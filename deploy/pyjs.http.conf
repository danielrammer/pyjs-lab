# BEGIN PYJS
server {
    listen 80;
    listen [::]:80;
    server_name pyjs.ancora.cyou;
    root /home/dnl/pyjs/current;
    index index.html;
    add_header X-PYJS-App "PYJS" always;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    location ^~ /.well-known/acme-challenge/ {
        root /home/dnl/pyjs/acme;
        default_type text/plain;
    }
    location ^~ /nicegui-dist/ {
        types {
            text/html html;
            text/css css;
            text/javascript js mjs;
            application/wasm wasm;
            application/json json;
            font/woff2 woff2;
            image/svg+xml svg;
            image/png png;
        }
        try_files $uri =404;
    }
    location ~ \.(py|json)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
# END PYJS
