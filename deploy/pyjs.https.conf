# BEGIN PYJS
server {
    listen 80;
    listen [::]:80;
    server_name pyjs.ancora.cyou;
    location ^~ /.well-known/acme-challenge/ {
        root /home/dnl/pyjs/acme;
        default_type text/plain;
    }
    location / { return 301 https://pyjs.ancora.cyou$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pyjs.ancora.cyou;
    root /home/dnl/pyjs/current;
    index index.html;
    ssl_certificate /home/dnl/pyjs/tls/live/pyjs.ancora.cyou/fullchain.pem;
    ssl_certificate_key /home/dnl/pyjs/tls/live/pyjs.ancora.cyou/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-PYJS-App "PYJS" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    location /api/ {
        proxy_pass http://127.0.0.1:3192;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
    }
    location ~ \.(py|json)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
# END PYJS
