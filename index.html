<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PYJS Code Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span id="productName">PYJS</span><small>CODE LAB</small></div>
    <nav class="language-switch" aria-label="Programming language">
      <button class="lang active" data-language="python">Python</button>
      <button class="lang" data-language="javascript">JavaScript</button>
    </nav>
    <div class="actions">
      <button id="openButton">Open</button>
      <button id="saveButton">Save</button>
      <button id="themeButton" title="Switch color theme" aria-pressed="false">☀ Light Theme</button>
      <button id="completionButton" title="Switch completion mode">Completion: AUTO</button>
      <button id="convertButton" title="Convert the current code when switching languages (best effort)" aria-pressed="false">Convert on switch: OFF</button>
      <button id="runButton" class="primary">▶ Run <kbd>Ctrl↵</kbd></button>
    </div>
  </header>

  <main>
    <section class="editor-panel">
      <div class="panel-title"><span id="fileName">main.py</span><span id="status">Ready</span></div>
      <div id="editor"></div>
    </section>
    <section class="output-panel">
      <div class="panel-title"><span>Output</span><button id="clearButton">Clear</button></div>
      <pre id="output" aria-live="polite">Ready.</pre>
    </section>
  </main>

  <input id="fileInput" type="file" accept=".py,.js,.mjs,.txt" hidden>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <script src="config.js"></script>
  <script src="app.bundle.js"></script>
</body>
</html>
